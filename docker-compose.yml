# FAF webclient - a private test server (Dockhand stack)
#
# FAF itself runs the image built from this repo (Dockerfile, gitops-stack
# apps/faf-webclient). This file is for running your own copy: no image build,
# the container clones the repo at start and runs it.
#
# This service has NO database and NO volume. It serves static files, proxies
# read-only public APIs and relays the Chat tab's login, so there is nothing to
# persist. Its one optional secret comes from Dockhand's environment. If it is destroyed and recreated, it comes back identical. That is
# also what makes auto-update safe here: a redeploy cannot lose data, because
# there is no data.
#
# AUTO-UPDATE: with AUTO_UPDATE=1 the app polls the git remote and, when the
# branch moves, clones the new revision to a temp dir, syntax-checks it and runs
# the test suite. Only if that passes does it exit - and `restart: unless-stopped`
# makes Docker restart it on ANY exit, including exit 0, so the command re-runs
# and re-clones. That restart policy is load-bearing: change it to `on-failure`
# and auto-update silently stops working.
#
# A commit that fails verification is logged loudly and NOT deployed; the old
# version keeps serving. That matters because the whole point of this feature is
# to let someone with only GitHub access update the site.

name: faf-web

services:
  faf-web:
    image: node:24-bookworm
    container_name: faf-web
    hostname: faf-web

    # Load-bearing for auto-update. See above.
    restart: unless-stopped

    ports:
      # host:container. Nginx Proxy Manager forwards to the host side.
      - "8098:8098"

    environment:
      PORT: "8098"

      # Auto-update. Set to "0" or remove to go back to manual restarts.
      AUTO_UPDATE: "1"
      # Must match the branch the clone command below checks out.
      UPDATE_BRANCH: "main"
      # Minimum 30000. One cheap `git ls-remote` per interval.
      UPDATE_INTERVAL_MS: "60000"

      # Service login for FAF's API. Maps, Mods and Replays need it: FAF's API
      # has no anonymous listings. Set both values in Dockhand's environment
      # for this stack, never in this file - the file is public on GitHub.
      # Leave them empty and those three tabs say the login is missing.
      FAF_API_CLIENT_ID: "${FAF_API_CLIENT_ID:-}"
      FAF_API_CLIENT_SECRET: "${FAF_API_CLIENT_SECRET:-}"

      # The Chat tab's player login (FAF's public "FAF Web" client, no secret).
      # Empty uses the default. "off" hides the login, e.g. until FAF has
      # created the client.
      FAF_LOGIN_CLIENT_ID: "${FAF_LOGIN_CLIENT_ID:-}"

    command: ["sh", "-c", "set -e; rm -rf /app; mkdir -p /app; git clone --depth 1 --branch main https://github.com/FAForever/faf-webclient.git /app; cd /app; exec node server.js"]
